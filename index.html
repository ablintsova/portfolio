  <style>
    :root {
      --splash-bg: #1d246f;
      --splash-accent: #8e5cff;
      --splash-accent-soft: rgba(142, 92, 255, 0.2);
      --splash-text: #f7f2ff;
      --splash-muted: rgba(247, 242, 255, 0.68);
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--splash-bg);
    }

    body {
      overflow: hidden;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
      color: var(--splash-text);
      background:
        radial-gradient(circle at 18% 18%, rgba(39, 48, 138, 0.9), transparent 34%),
        radial-gradient(circle at 78% 62%, rgba(124, 67, 238, 0.72), transparent 38%),
        radial-gradient(circle at 50% 92%, rgba(77, 46, 176, 0.55), transparent 42%),
        linear-gradient(135deg, #1d246f 0%, #673ab7 50%, #7c4dff 100%);
      transition: opacity 320ms ease, visibility 320ms ease;
    }

    #app-splash::before {
      content: "";
      position: absolute;
      width: min(78vw, 560px);
      height: min(78vw, 560px);
      border: 1px solid rgba(247, 242, 255, 0.11);
      border-radius: 42% 58% 48% 52%;
      animation: splash-orbit 8s linear infinite;
    }

    #app-splash::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(247, 242, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247, 242, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
    }

    #app-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-loader {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 26px;
      text-align: center;
    }

    .splash-orb {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 50%, rgba(247, 242, 255, 0.2) 0 18%, transparent 19%),
        conic-gradient(from 0deg, transparent 0deg 54deg, #d6c7ff 72deg 124deg, transparent 142deg 360deg);
      box-shadow:
        0 0 0 1px rgba(247, 242, 255, 0.12),
        0 0 52px rgba(142, 92, 255, 0.28);
      animation: splash-spin 1.45s cubic-bezier(0.64, 0, 0.36, 1) infinite;
    }

    .splash-orb::before,
    .splash-orb::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(247, 242, 255, 0.18);
      border-radius: 42% 58% 48% 52%;
    }

    .splash-orb::after {
      inset: 36px;
      border-color: rgba(214, 199, 255, 0.58);
      border-radius: 56% 44% 52% 48%;
      animation: splash-pulse 1.45s ease-in-out infinite;
    }

    .splash-title {
      margin: 0;
      color: var(--splash-text);
      font: 700 clamp(26px, 6vw, 42px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: -0.04em;
    }

    .splash-progress {
      position: relative;
      width: min(64vw, 260px);
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 248, 239, 0.13);
    }

    .splash-progress::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--splash-accent), transparent);
      animation: splash-loading 1.35s ease-in-out infinite;
    }

    .splash-status {
      margin-top: 14px;
      color: var(--splash-muted);
      font: 600 11px/1.3 Verdana, Geneva, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    @keyframes splash-loading {
      0% {
        transform: translateX(-105%);
      }
      100% {
        transform: translateX(245%);
      }
    }

    @keyframes splash-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes splash-pulse {
      0%,
      100% {
        transform: scale(0.86);
        opacity: 0.58;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-splash::before,
      .splash-orb,
      .splash-orb::after,
      .splash-progress::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-label="Loading Portfolio" role="status">
    <div class="splash-loader">
      <div class="splash-orb" aria-hidden="true"></div>
      <h1 class="splash-title">Flutter Developer Portfolio</h1>
      <div class="splash-progress" aria-hidden="true"></div>
      <div class="splash-status">Loading</div>
    </div>
  </div>
  <noscript>
    <style>
      #app-splash .splash-status::after {
        content: ". Enable JavaScript to open the site.";
        letter-spacing: normal;
        text-transform: none;
      }
    </style>
  </noscript>
  <script>
    (function () {
      var splashHidden = false;

      function hideSplash() {
        if (splashHidden) {
          return;
        }

        splashHidden = true;

        var splash = document.getElementById('app-splash');
        if (!splash) {
          return;
        }

        splash.classList.add('splash-hidden');
        document.body.style.overflow = '';
        window.setTimeout(function () {
          splash.remove();
        }, 360);
      }

      window.addEventListener('flutter-first-frame', hideSplash);
      document.addEventListener('flutter-first-frame', hideSplash);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
